<!DOCTYPE html>

<html lang="en">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Track Order - ABUBAKAR & BROTHERS HERBAL COMPANY LIMITED</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- HEADER -->
<header>

    <div class="logo">
        ABUBAKAR & BROTHERS HERBAL COMPANY LIMITED
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="cart.html">Cart 🛒</a>
    </nav>

</header>


<!-- TRACK ORDER -->
<section class="track-section">

    <div class="track-card">

        <h1>Track Your Order 📦</h1>

        <p>
            Enter your Order ID below to check your order status.
        </p>

        <input
            type="text"
            id="order-id-input"
            placeholder="Enter Order ID"
        >

        <button onclick="trackOrder()">
            Track Order
        </button>

        <div id="tracking-result"></div>

    </div>

</section>


<!-- FOOTER -->
<footer>

    <p>
        © 2026 ABUBAKAR & BROTHERS HERBAL COMPANY LIMITED. All Rights Reserved.
    </p>

</footer>


<script src="script.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const params =
        new URLSearchParams(window.location.search);

    const orderId =
        params.get("orderId");

    const input =
        document.getElementById("order-id-input");

    if (orderId && input) {

        input.value = orderId;

        trackOrder();
    }

});
</script>
</body>

</html>
