<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ABUBAKAR & BROTHERS HERBAL COMPANY LIMITED</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            ABUBAKAR & BROTHERS HERBAL COMPANY LIMITED
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart 🛒</a>
        </nav>

    </header>


    <section class="auth-section">

        <div class="auth-card">

            <h1>Login</h1>

            <p>
                Login to your account
            </p>

            <form id="login-form">

                <input
                    type="email"
                    id="login-email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="login-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

            <p id="login-message"></p>

        </div>

    </section>


    <footer>

        <p>
            © 2026 ABUBAKAR & BROTHERS HERBAL COMPANY LIMITED. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
