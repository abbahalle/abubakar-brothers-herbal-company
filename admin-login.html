```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login - ABUBAKAR & BROTHERS HERBAL COMPANY LIMITED</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            ABUBAKAR & BROTHERS HERBAL COMPANY LIMITED
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Customer Login
            </a>

        </nav>

    </header>


    <!-- ADMIN LOGIN -->

    <section class="auth-section">

        <div class="auth-card">

            <h1>
                Admin Login 🔐
            </h1>

            <p>
                Login to access the admin dashboard.
            </p>


            <form id="admin-login-form">

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Admin Email"
                    required
                >


                <input
                    type="password"
                    id="admin-password"
                    placeholder="Admin Password"
                    required
                >


                <button type="submit">
                    Login as Admin
                </button>

            </form>


            <p
                id="admin-login-message"
                class="auth-message"
            ></p>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 ABUBAKAR & BROTHERS HERBAL COMPANY LIMITED. All Rights Reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
```
