<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - ABUBAKAR & BROTHERS HERBAL COMPANY LIMITED</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            ABUBAKAR & BROTHERS HERBAL COMPANY LIMITED
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart 🛒</a>
        </nav>
    </header>


    <!-- CHECKOUT -->
    <section class="checkout-section">

        <h1>Checkout</h1>

        <form id="checkout-form">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="08012345678"
                required
            >

            <label for="address">Delivery Address</label>
            <textarea
                id="address"
                placeholder="Enter your delivery address"
                required
            ></textarea>

            <button type="submit">
                Place Order
            </button>

        </form>

    </section>


    <!-- FOOTER -->
    <footer>
        <p>© 2026 ABUBAKAR & BROTHERS HERBAL COMPANY LIMITED. All Rights Reserved.</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
